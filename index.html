<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studentska lista - Studenti pobeđuju</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(15,23,42,0.75),
        rgba(15,23,42,0.75)
    ),
    url("studenti-pobedjuju-1.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    font-family:'Segoe UI',sans-serif;
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:1200px;
    text-align:center;

    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);

    border-radius:30px;

    padding:50px 30px;

    box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.main-title{
    font-size:3rem;
    font-weight:900;
    letter-spacing:4px;
    text-transform:uppercase;
}

.subtitle{
    margin-top:10px;
    font-size:1.4rem;
    font-weight:700;
    color:#fbbf24;
    letter-spacing:3px;
    text-transform:uppercase;
}

.timer{
    margin:50px auto;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:15px;
    flex-wrap:nowrap;
}

.box{
    width:180px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:20px;

    padding:25px 10px;
}

.number{
    font-size:4rem;
    font-weight:900;

    color:#fbbf24;

    text-shadow:
        0 0 10px rgba(251,191,36,.6),
        0 0 25px rgba(251,191,36,.4);
}

.label{
    margin-top:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:.9rem;
}

.footer{
    margin-top:30px;
    font-size:1.4rem;
    font-weight:600;
    line-height:1.7;
}

.date{
    color:#fbbf24;
    font-size:2rem;
    font-weight:900;
}

    .main-title{
        font-size:2rem;
    }

    .subtitle{
        font-size:1rem;
    }

    .timer{
        gap:6px
