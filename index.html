<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENTSKA LISTA</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif, system-ui;
            background: #0a0a0c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            text-align: center;
            padding: 3rem 2rem;
            background: #141419;
            border: 1px solid #2a2a35;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            max-width: 650px;
            width: 90%;
        }

        h1 {
            font-size: 1.6rem;
            color: #f1c40f;
            letter-spacing: 2px;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .unit {
            background: #1c1c24;
            border: 1px solid #333342;
            padding: 1.2rem;
            border-radius: 16px;
            min-width: 85px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .unit span.num {
            font-size: 2.8rem;
            font-weight: 800;
            color: #f39c12;
            text-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
            display: block;
        }

        .unit span.txt {
            font-size: 0.75rem;
            color: #888899;
            text-transform: uppercase;
            margin-top: 0.5rem;
            display: block;
        }

        .footer-text {
            font-size: 1.1rem;
            color: #cccccc;
            font-weight: 300;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>STUDENTSKA LISTA - STUDENTI POBEĐUJU</h1>
        <div id="sat1" class="countdown">
            <div class="unit"><span id="d1" class="num">00</span><span class="txt">Dana</span></div>
            <div class="unit"><span id="h1" class="num">00</span><span class="txt">Sati</span></div>
            <div class="unit"><span id="m1" class="num">00</span><span class="txt">Minuta</span></div>
            <div class="unit"><span id="s1" class="num">00</span><span class="txt">Sekundi</span></div>
        </div>
        <div class="footer-text">Odbrojavanje do pobede! - 25.10.2026</div>
    </div>

    <script>
        const cilj = new Date('2026-10-25T00:00:00').getTime();
        setInterval(() => {
            const razlika = cilj - new Date().getTime();
            if (razlika > 0) {
                document.getElementById('d1').innerText = String(Math.floor(razlika / 86400000)).padStart(2, '0');
                document.getElementById('h1').innerText = String(Math.floor((razlika % 86400000) / 3600000)).padStart(2, '0');
                document.getElementById('m1').innerText = String(Math.floor((razlika % 3600000) / 60000)).padStart(2, '0');
                document.getElementById('s1').innerText = String(Math.floor((razlika % 60000) / 1000)).padStart(2, '0');
            }
        }, 1000);
    </script>
</body>
</html>
